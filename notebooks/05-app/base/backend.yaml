apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_HOST:      "postgresql"
  DB_PORT:      "5432"
  DB_NAME:      "imagelab"
  DB_USER:      "imagelab"
  MODEL_NAME:   "image-classifier"
  IMG_SIZE:     "64"
  CLASSES:      "intact,damaged,tampered"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Using a lightweight Python image; app is loaded via ConfigMap/init
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install fastapi uvicorn psycopg2-binary boto3 requests pillow numpy -q && \
          python /app/main.py
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: postgresql-secret
        env:
        - name: INFERENCE_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: INFERENCE_URL
              optional: true
        - name: AWS_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: student-data-connection
              key: AWS_S3_ENDPOINT
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: student-data-connection
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: student-data-connection
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: student-data-connection
              key: AWS_S3_BUCKET
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: app-code
        configMap:
          name: backend-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
spec:
  to:
    kind: Service
    name: backend
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
