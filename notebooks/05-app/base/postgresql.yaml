apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
type: Opaque
stringData:
  POSTGRESQL_USER:     imagelab
  POSTGRESQL_PASSWORD: imagelab123
  POSTGRESQL_DATABASE: imagelab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        # registry.redhat.io is covered by the cluster global pull secret.
        # registry.access.redhat.io has DNS failures on this cluster — do NOT use it.
        # SHA pinned to the version cached in the OpenShift ImageStream (postgresql:15-el9).
        image: registry.redhat.io/rhel9/postgresql-15@sha256:8b8b95606e6d06eb866c825ddcc758223a3c34424477c43ce8e3b2b82da62054
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: postgresql-secret
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "imagelab"]
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
